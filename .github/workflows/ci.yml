name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只跑项目基线（.nvmrc / Dockerfile / engines 都是 22）。
        # 曾把 24 也放进矩阵，结果发现 vitest 2 的 worker（tinypool）在 Node 24 下
        # 直接 "Worker exited unexpectedly"，与本项目代码无关：见 issues/#10
        # （升级 vitest 后再把 24 加回来）。
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run preflight -- --warn-only
      - run: npm test
      - run: npm run build

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t street-food-map:ci .
      - name: Run container (first boot)
        run: |
          docker run -d --name sfm -p 3000:3000 \
            -e ADMIN_PASSWORD=ci-smoke-test-password \
            -e SEED_DEMO=1 \
            street-food-map:ci
      - name: Wait for readiness and smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/config > /tmp/config.json; then
              echo "app is up after ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/config | head -c 400
          curl -fsS -o /dev/null -w 'home=%{http_code}\n' http://127.0.0.1:3000/
          curl -fsS -o /dev/null -w 'admin-login=%{http_code}\n' http://127.0.0.1:3000/admin/login
      - name: Container logs
        if: always()
        run: docker logs sfm

  e2e:
    name: playwright (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
