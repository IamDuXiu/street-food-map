<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>饭签 · 深圳餐饮地图（原型演示）</title>
  <style>
    :root {
      --ink: #1f2022;
      --muted: #737579;
      --faint: #9a9b9d;
      --line: #e7e7e5;
      --surface: #fff;
      --paper: #f7f7f5;
      --map: #edf0ee;
      --building: #dfe3e0;
      --road: #fbfbfa;
      --park: #dce8df;
      --metro: #c3cfca;
      --coral: #ef806c;
      --coral-ink: #b74d3f;
      --shadow: 0 16px 44px rgba(31, 32, 34, .12);
      --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--surface); color: var(--ink); font-family: var(--font); }
    body { overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .app { height: 100dvh; display: flex; flex-direction: column; }
    header { flex: 0 0 auto; padding: 15px 22px 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.98); position: relative; z-index: 20; }
    .topbar { max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 9px; min-width: 114px; border: 0; background: transparent; padding: 0; cursor: pointer; font-weight: 760; letter-spacing: -.03em; }
    .brand-mark { width: 26px; height: 26px; border-radius: 9px 9px 9px 3px; background: var(--coral); display: grid; place-items: center; color: white; font-size: 9px; line-height: 1; font-weight: 850; letter-spacing: 0; }
    .brand-name { font-size: 17px; }
    .brand-note { color: var(--faint); font-size: 10px; font-weight: 600; letter-spacing: .04em; display: block; margin-top: 1px; }
    .location-trigger { border: 0; background: transparent; display: flex; align-items: center; gap: 7px; padding: 8px 9px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
    .location-trigger:hover, .location-trigger:focus-visible { background: var(--paper); outline: none; }
    .location-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 4px #fff2ef; }
    .location-copy { text-align: left; line-height: 1.18; }
    .location-city { display: block; font-size: 13px; font-weight: 730; }
    .location-area { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
    .chevron { color: var(--faint); font-size: 15px; margin-left: 1px; }
    .search-shell { margin-left: auto; width: min(430px, 38vw); height: 40px; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); transition: border-color .2s, box-shadow .2s; }
    .search-shell:focus-within { border-color: #bababa; box-shadow: 0 0 0 3px #f1f1ef; }
    .search-icon { width: 16px; height: 16px; margin-left: 15px; color: #818285; }
    .search-input { flex: 1; min-width: 0; padding: 0 9px; border: 0; outline: 0; background: transparent; font-size: 13px; }
    .clear-search { width: 30px; height: 30px; margin-right: 5px; border: 0; border-radius: 50%; background: transparent; color: #8d8f91; cursor: pointer; display: none; }
    .clear-search.show { display: block; }
    .header-reset { flex: 0 0 auto; border: 1px solid var(--line); border-radius: 9px; background: white; font-size: 12px; padding: 8px 10px; cursor: pointer; color: var(--muted); }
    .header-reset:hover { border-color: #bdbdbd; color: var(--ink); }
    .filterbar { max-width: 1440px; margin: 10px auto 0; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .filterbar::-webkit-scrollbar { display: none; }
    .filter-label { color: var(--faint); font-size: 11px; margin-right: 2px; white-space: nowrap; }
    .pill { height: 31px; padding: 0 12px; border: 1px solid var(--line); background: #fff; border-radius: 99px; cursor: pointer; white-space: nowrap; font-size: 12px; transition: background .18s, color .18s, border .18s, transform .18s; }
    .pill:hover { border-color: #bcbdbf; transform: translateY(-1px); }
    .pill.is-selected { border-color: var(--ink); background: var(--ink); color: #fff; }
    .pill .sub { color: var(--muted); margin-left: 2px; }
    .pill.is-selected .sub { color: #d6d6d6; }
    .filter-divider { width: 1px; height: 19px; background: var(--line); margin: 0 3px; }
    .sort-wrap { margin-left: auto; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .sort-label { font-size: 11px; color: var(--faint); }
    .sort-select { border: 0; background: transparent; font-size: 12px; font-weight: 650; color: var(--ink); cursor: pointer; outline: 0; }
    .workspace { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(320px, 370px) minmax(0, 1fr); }
    .list-pane { min-height: 0; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; z-index: 8; }
    .list-head { padding: 18px 20px 13px; display: flex; align-items: end; justify-content: space-between; gap: 10px; }
    .list-title { font-size: 16px; font-weight: 760; letter-spacing: -.02em; }
    .list-caption { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .result-count { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .cards { min-height: 0; overflow-y: auto; padding: 0 12px 28px; }
    .place-card { position: relative; border: 1px solid transparent; border-radius: 13px; padding: 14px 12px 13px; margin-bottom: 6px; cursor: pointer; transition: background .18s, border-color .18s, box-shadow .18s; }
    .place-card:hover { background: #fafafa; }
    .place-card.is-active { background: #f7f7f5; border-color: #dededb; box-shadow: 0 0 0 1px #e2e2df; }
    .card-top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .meal-name { font-size: 16px; font-weight: 760; letter-spacing: -.02em; line-height: 1.25; }
    .price-pill { background: #fff; border: 1px solid var(--ink); color: var(--ink); border-radius: 99px; padding: 4px 9px; font-size: 12px; line-height: 1; font-weight: 780; white-space: nowrap; }
    .place-card.is-active .price-pill { background: var(--ink); color: white; }
    .store-line { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .store-line .distance { color: var(--ink); font-weight: 680; }
    .store-line .sep { color: #c1c1c1; }
    .card-bottom { margin-top: 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 11px; }
    .access-tag { color: var(--muted); background: #f0f1ef; padding: 3px 6px; border-radius: 5px; }
    .verified { white-space: nowrap; }
    .card-fav { position: absolute; top: 43px; right: 12px; border: 0; background: transparent; color: #b2b3b4; cursor: pointer; padding: 4px; font-size: 17px; line-height: 1; }
    .card-fav.is-loved { color: var(--coral); }
    .empty-list { margin: 18px 10px; padding: 28px 18px; border: 1px dashed #cfd1cf; border-radius: 13px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .empty-list strong { color: var(--ink); display: block; font-size: 14px; margin-bottom: 3px; }
    .map-pane { position: relative; min-width: 0; overflow: hidden; background: var(--map); }
    .map-stage { position: absolute; inset: 0; overflow: hidden; }
    .map-svg { width: 100%; height: 100%; display: block; background: var(--map); cursor: default; transition: transform .25s ease; transform-origin: 50% 50%; }
    .html-markers { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .html-marker { position: absolute; width: 54px; height: 35px; transform: translate(-50%, -50%); display: grid; place-items: center; border: 1px solid #242526; border-radius: 18px; background: #fff; color: #222; box-shadow: 0 2px 5px rgba(31,32,34,.22); font-size: 14px; line-height: 1; font-weight: 800; cursor: pointer; pointer-events: auto; }
    .html-marker.is-active { background: #222; color: #fff; border-color: #222; }
    .html-marker:focus-visible { outline: 3px solid rgba(31,32,34,.25); outline-offset: 2px; }
    .map-grid { stroke: #e1e6e2; stroke-width: 1; }
    .road { fill: none; stroke: var(--road); stroke-width: 22; stroke-linecap: round; }
    .road-line { fill: none; stroke: #dfe3e0; stroke-width: 1.4; stroke-linecap: round; }
    .building { fill: var(--building); stroke: #d5dcd7; stroke-width: 1; }
    .building-dark { fill: #d8ded9; }
    .park { fill: var(--park); stroke: #cbdccf; stroke-width: 1; }
    .map-label { fill: #9ba8a0; font-size: 12px; letter-spacing: .08em; }
    .map-label.strong { fill: #7c8d82; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
    .metro-line { fill: none; stroke: var(--metro); stroke-width: 3; stroke-dasharray: 4 5; }
    .map-control { position: absolute; top: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
    .map-control button, .map-locate { width: 38px; height: 38px; border: 1px solid #dedfdd; background: rgba(255,255,255,.94); border-radius: 11px; box-shadow: 0 4px 12px rgba(50,60,55,.08); cursor: pointer; font-size: 19px; display: grid; place-items: center; }
    .map-control button:hover, .map-locate:hover { background: white; border-color: #bfc2bf; }
    .map-control .zoom-level { font-size: 10px; color: var(--muted); height: 22px; border: 0; box-shadow: none; cursor: default; background: transparent; }
    .map-locate { position: absolute; right: 18px; bottom: 22px; z-index: 4; font-size: 15px; }
    .map-locate::before { content: ""; width: 10px; height: 10px; border: 1.5px solid #656e69; border-radius: 50%; }
    .map-note { position: absolute; left: 18px; bottom: 18px; z-index: 3; color: #76807a; background: rgba(255,255,255,.82); border: 1px solid rgba(214,218,214,.85); border-radius: 8px; padding: 7px 9px; font-size: 10px; line-height: 1.45; }
    .map-note b { color: #4d5750; font-weight: 700; }
    .map-marker { cursor: pointer; opacity: 0; pointer-events: none; }
    .map-marker:hover .marker-pin { stroke-width: 3.5; }
    .marker-pin { fill: var(--ink); stroke: white; stroke-width: 2.5; }
    .map-marker.is-active .marker-pin { fill: var(--ink); }
    .marker-price { fill: white; font-size: 10px; font-weight: 800; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .you-are-here { fill: #8c9990; stroke: white; stroke-width: 2; }
    .selected-card { position: absolute; left: 22px; bottom: 22px; width: min(340px, calc(100% - 52px)); z-index: 5; background: rgba(255,255,255,.98); border: 1px solid #dededb; border-radius: 15px; box-shadow: var(--shadow); padding: 15px 16px; cursor: pointer; }
    .selected-card .meal-name { padding-right: 62px; }
    .selected-card .selected-meta { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .selected-card .selected-foot { display: flex; gap: 6px; align-items: center; margin-top: 11px; color: var(--faint); font-size: 11px; }
    .selected-card .selected-foot .access-tag { font-size: 10px; }
    .selected-open { margin-left: auto; border: 1px solid var(--line); background: #fff; border-radius: 7px; color: var(--ink); padding: 5px 7px; font-size: 10px; cursor: pointer; white-space: nowrap; }
    .mobile-sheet-actions { display: none; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(25,28,27,.27); display: none; align-items: stretch; justify-content: flex-end; }
    .modal-backdrop.is-open { display: flex; }
    .region-modal { width: min(720px, 100%); background: #fff; height: 100%; box-shadow: -14px 0 45px rgba(28,31,29,.14); display: flex; flex-direction: column; animation: slide-in .2s ease both; }
    @keyframes slide-in { from { transform: translateX(22px); opacity: .5; } to { transform: translateX(0); opacity: 1; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 17px; border-bottom: 1px solid var(--line); }
    .modal-kicker { color: var(--coral-ink); font-size: 11px; font-weight: 730; letter-spacing: .05em; }
    .modal-title { font-size: 21px; font-weight: 780; margin-top: 5px; letter-spacing: -.03em; }
    .modal-close { border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; }
    .modal-close:hover { background: var(--paper); }
    .region-headline { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 10px; }
    .region-city { font-size: 13px; font-weight: 760; }
    .region-demo { font-size: 10px; color: var(--faint); }
    .region-layout { min-height: 0; flex: 1; display: grid; grid-template-columns: 205px minmax(0,1fr); }
    .region-nav { border-right: 1px solid var(--line); padding: 0 10px 20px 14px; overflow-y: auto; }
    .region-nav button { display: block; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 9px; padding: 10px 11px; color: var(--muted); cursor: pointer; font-size: 12px; margin-bottom: 2px; }
    .region-nav button:hover { background: var(--paper); color: var(--ink); }
    .region-nav button.is-selected { background: #f1f1ef; color: var(--ink); font-weight: 740; box-shadow: inset 3px 0 var(--coral); }
    .region-districts { padding: 0 22px 22px; overflow-y: auto; }
    .district-heading { color: var(--faint); font-size: 11px; padding: 2px 0 11px; }
    .district-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .district-btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; text-align: left; padding: 12px; cursor: pointer; min-height: 58px; }
    .district-btn:hover { border-color: #b8bab8; background: #fbfbfa; }
    .district-btn strong { display: block; font-size: 12px; }
    .district-btn span { display: block; color: var(--faint); font-size: 10px; margin-top: 4px; }
    .district-empty { border: 1px dashed #d3d6d3; border-radius: 12px; padding: 24px 18px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .district-empty strong { display: block; color: var(--ink); font-size: 13px; margin-bottom: 3px; }
    .district-back { border: 0; background: #f3f3f1; border-radius: 8px; padding: 9px 11px; color: var(--ink); cursor: pointer; font-size: 11px; margin-top: 13px; }
    .detail-panel { position: fixed; z-index: 45; top: 0; right: 0; height: 100%; width: min(470px, 100%); background: white; box-shadow: -14px 0 46px rgba(25,28,27,.17); display: none; flex-direction: column; animation: slide-in .2s ease both; }
    .detail-panel.is-open { display: flex; }
    .detail-head { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .detail-back { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 5px 0; }
    .detail-head .modal-close { margin-left: auto; }
    .detail-body { overflow-y: auto; padding: 25px 25px 36px; }
    .detail-price { display: inline-block; border: 1px solid var(--ink); border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 780; }
    .detail-title { font-size: 28px; line-height: 1.2; letter-spacing: -.04em; margin: 15px 0 7px; }
    .detail-store { color: var(--muted); font-size: 13px; }
    .detail-facts { margin: 21px 0; display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .fact { padding: 13px 0; }
    .fact + .fact { border-left: 1px solid var(--line); padding-left: 16px; }
    .fact-label { display: block; color: var(--faint); font-size: 10px; margin-bottom: 5px; }
    .fact-value { display: block; font-size: 13px; font-weight: 700; }
    .detail-section { margin-top: 21px; }
    .detail-section h3 { font-size: 12px; margin: 0 0 9px; color: var(--muted); font-weight: 760; }
    .condition { border-left: 3px solid var(--coral); background: #fff6f2; padding: 11px 12px; font-size: 12px; line-height: 1.6; }
    .other-meals { display: flex; flex-wrap: wrap; gap: 7px; }
    .other-meal { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; font-size: 11px; }
    .other-meal b { margin-left: 7px; font-size: 12px; }
    .evidence { border: 1px dashed #cfd2cf; border-radius: 10px; padding: 13px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 24px; }
    .detail-action { height: 42px; border-radius: 10px; cursor: pointer; font-size: 12px; }
    .detail-action.primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .detail-action.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 90; transform: translate(-50%, 14px); background: var(--ink); color: #fff; border-radius: 9px; padding: 10px 14px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; white-space: nowrap; }
    .toast.is-visible { opacity: 1; transform: translate(-50%,0); }
    @media (max-width: 760px) {
      body { overflow: hidden; }
      header { padding: 11px 14px 10px; }
      .topbar { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; }
      .brand { min-width: 78px; gap: 6px; }
      .brand-mark { width: 23px; height: 23px; border-radius: 8px 8px 8px 3px; font-size: 10px; }
      .brand-name { font-size: 15px; }
      .brand-note { display: none; }
      .location-trigger { padding: 6px 4px; min-width: 0; }
      .location-city { font-size: 12px; }
      .location-area { overflow: hidden; text-overflow: ellipsis; max-width: 112px; white-space: nowrap; }
      .search-shell { grid-column: 1 / -1; grid-row: 2; width: 100%; height: 38px; }
      .header-reset { font-size: 11px; padding: 7px 8px; }
      .filterbar { margin-top: 9px; gap: 6px; padding-bottom: 1px; }
      .filter-label { display: none; }
      .pill { height: 29px; padding: 0 10px; font-size: 11px; }
      .filter-divider { margin: 0 2px; }
      .sort-wrap { margin-left: auto; }
      .sort-label { display: none; }
      .workspace { position: relative; display: block; }
      .map-pane { position: absolute; inset: 0; }
      .list-pane { position: absolute; z-index: 9; left: 0; right: 0; bottom: 0; height: 64px; border-right: 0; border-top: 1px solid #d8d9d6; border-radius: 18px 18px 0 0; box-shadow: 0 -10px 30px rgba(37,39,37,.1); transition: height .28s ease; overflow: hidden; }
      .list-pane[data-sheet="half"] { height: 50%; }
      .list-pane[data-sheet="full"] { height: calc(100% - 8px); }
      .list-head { padding: 9px 15px 7px; display: block; position: relative; }
      .list-head::before { content: ""; display: block; width: 33px; height: 4px; border-radius: 99px; background: #d3d3d0; margin: 0 auto 9px; }
      .list-title { font-size: 14px; }
      .list-caption { font-size: 10px; margin-top: 2px; }
      .result-count { position: absolute; right: 15px; bottom: 10px; }
      .mobile-sheet-actions { display: flex; position: absolute; top: 8px; right: 12px; gap: 5px; }
      .mobile-sheet-actions button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 4px 7px; font-size: 10px; cursor: pointer; }
      .cards { padding: 0 9px 26px; }
      .place-card { padding: 13px 11px; }
      .map-control { top: 14px; right: 14px; }
      .map-locate { right: 14px; bottom: 80px; }
      .map-note { left: 13px; bottom: 79px; max-width: 162px; }
      .selected-card { left: 14px; bottom: 77px; width: calc(100% - 70px); padding: 13px 13px; }
      .detail-panel { width: 100%; }
      .detail-body { padding: 22px 20px 32px; }
      .region-modal { width: 100%; }
      .modal-head { padding: 18px 18px 14px; }
      .region-headline { padding-left: 18px; padding-right: 18px; }
      .region-layout { grid-template-columns: 128px minmax(0,1fr); }
      .region-nav { padding-left: 8px; padding-right: 7px; }
      .region-nav button { padding: 9px 8px; font-size: 11px; }
      .region-districts { padding: 0 15px 20px; }
      .district-grid { grid-template-columns: 1fr; }
      .district-btn { min-height: 52px; padding: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="topbar">
        <button class="brand" id="brandReset" aria-label="饭签，重置演示">
          <span class="brand-mark">饭签</span>
          <span><span class="brand-name">饭签</span><span class="brand-note">深圳餐饮地图 · 原型</span></span>
        </button>
        <button class="location-trigger" id="locationTrigger" aria-haspopup="dialog" aria-expanded="false">
          <span class="location-dot" aria-hidden="true"></span>
          <span class="location-copy"><span class="location-city" id="locationCity">深圳市</span><span class="location-area" id="locationArea">南山 · 粤海科技园</span></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <label class="search-shell" aria-label="搜索店名、餐名或类别">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.7"></circle><path d="m16 16 5 5"></path></svg>
          <input id="searchInput" class="search-input" type="search" placeholder="搜索店名、餐名或类别" autocomplete="off" />
          <button id="clearSearch" class="clear-search" type="button" aria-label="清空搜索">×</button>
        </label>
        <button id="headerReset" class="header-reset" type="button">重置演示</button>

      function mapPoint(p) { const stage=document.querySelector('.map-stage'), rect=stage.getBoundingClientRect(), vw=1000, vh=760; const scale=Math.max(rect.width/vw, rect.height/vh); const offsetX=(rect.width-vw*scale)/2, offsetY=(rect.height-vh*scale)/2; const cx=rect.width/2, cy=rect.height/2; return { left:cx+(offsetX+p.x*scale-cx)*state.zoom, top:cy+(offsetY+p.y*scale-cy)*state.zoom }; }
      function renderMarkers(result) { mapMarkers.innerHTML=''; htmlMarkers.innerHTML=''; result.forEach(p=>{ const g=document.createElementNS('http://www.w3.org/2000/svg','g'); g.setAttribute('class','map-marker'+(p.id===state.selectedId?' is-active':'')); g.setAttribute('data-id',p.id); g.setAttribute('transform','translate('+p.x+' '+p.y+')'); g.innerHTML='<circle class="marker-pin" r="17"></circle>'; mapMarkers.appendChild(g); const button=document.createElement('button'); button.type='button'; button.className='html-marker'+(p.id===state.selectedId?' is-active':''); button.style.left=mapPoint(p).left+'px'; button.style.top=mapPoint(p).top+'px'; button.setAttribute('aria-label',p.meal+'，¥'+p.price); button.textContent='¥'+p.price; button.addEventListener('click',()=>{state.selectedId=p.id;renderList();}); htmlMarkers.appendChild(button); }); }
      function openDetail(id) { const p=places.find(x=>x.id===id); if(!p) return; state.selectedId=id; state.detailId=id; const body=$('detailBody'); body.innerHTML='<span class="detail-price">单人餐 · ¥'+p.price+'</span><h1 class="detail-title" id="detailTitle">'+p.meal+'</h1><div class="detail-store">'+p.store+' · '+p.area+'</div><div class="detail-facts"><div class="fact"><span class="fact-label">距离（演示）</span><span class="fact-value">'+formatDistance(p.distance)+'</span></div><div class="fact"><span class="fact-label">最近核验（演示）</span><span class="fact-value">'+p.verified.replace('演示核验 · ','')+'</span></div></div><section class="detail-section"><h3>准入 / 供应条件</h3><div class="condition">'+p.condition+'</div></section><section class="detail-section"><h3>其他可选餐食</h3><div class="other-meals">'+p.other.map(m=>'<span class="other-meal">'+m[0]+' <b>¥'+m[1]+'</b></span>').join('')+'</div></section><section class="detail-section"><h3>证据区域</h3><div class="evidence">这里预留正式版的证据卡：来源链接、核验人、核验时间、价格截图或门店公告。当前为占位文字，不代表真实证据。</div></section><div class="detail-actions"><button class="detail-action secondary" id="loveDetail" type="button">'+(state.loved.has(p.id)?'♥ 已收藏':'♡ 收藏此餐')+'</button><button class="detail-action primary" id="navigateDemo" type="button">导航（演示）</button></div>'; $('detailPanel').classList.add('is-open'); $('detailPanel').setAttribute('aria-hidden','false'); setTimeout(()=>$('closeDetail').focus(),0); $('loveDetail').addEventListener('click',()=>{toggleLove(p.id); $('loveDetail').textContent=state.loved.has(p.id)?'♥ 已收藏':'♡ 收藏此餐';}); $('navigateDemo').addEventListener('click',()=>toast('正式版将打开外部导航；本原型不会发起外网请求。')); }
      function closeDetail(){ $('detailPanel').classList.remove('is-open'); $('detailPanel').setAttribute('aria-hidden','true'); state.detailId=null; }
      function toggleLove(id){ if(state.loved.has(id)){state.loved.delete(id);toast('已取消收藏（仅本次会话）');}else{state.loved.add(id);toast('已收藏（仅本次会话）');} renderList(); }
      function renderRegionNav(){ const nav=$('regionNav'); nav.innerHTML=navLabels.map(label=>'<button type="button" data-region="'+label+'" class="'+(state.region===label?'is-selected':'')+'">'+label+'</button>').join(''); nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.region=b.dataset.region;state.district=null;renderRegionNav();renderDistricts();renderList();})); }
      function renderDistricts(){ const data=currentRegion(), content=$('regionDistricts'); const has=data.ids.length>0; content.innerHTML='<div class="district-heading">'+data.note+'</div>'+(has?'<div class="district-grid">'+data.districts.map(d=>'<button class="district-btn" type="button" data-district="'+d[0]+'"><strong>'+d[0]+'</strong><span>'+d[1]+'</span></button>').join('')+'</div>':'<div class="district-empty"><strong>该区域暂未配置示例</strong>正式版可在这里接入已核验餐食。当前仅展示南山科技园与福田车公庙的演示数据。<br /><button class="district-back" type="button" id="regionBackToTech">回到科技园入口</button></div>'); content.querySelectorAll('.district-btn').forEach(b=>b.addEventListener('click',()=>{state.district=b.dataset.district;const target=districtOverrides[b.dataset.district];if(target)state.region=target.base;renderRegionNav();renderDistricts();renderList();closeRegion();toast('已切换到 '+currentRegion().area); })); const back=$('regionBackToTech'); if(back) back.addEventListener('click',()=>{state.region='我的附近';state.district=null;renderRegionNav();renderDistricts();renderList();}); }
      function openRegion(){ renderRegionNav();renderDistricts();$('regionBackdrop').classList.add('is-open');$('locationTrigger').setAttribute('aria-expanded','true'); setTimeout(()=>$('closeRegion').focus(),0); }
      function closeRegion(){ $('regionBackdrop').classList.remove('is-open');$('locationTrigger').setAttribute('aria-expanded','false'); }
      function resetDemo(){ state.budget='20';state.category='all';state.query='';state.sort='nearest';state.region='我的附近';state.district=null;state.selectedId='rice-lab';state.zoom=1;state.loved.clear(); $('searchInput').value='';setMapZoom();closeDetail();closeRegion();renderList();toast('已重置为科技园附近演示'); }
      function setRegion(region){state.region=region;state.district=null;state.selectedId=regionData[region].ids[0]||null;renderList();}
      function setMapZoom(){ $('mapSvg').style.transform='scale('+state.zoom+')'; $('resetMap').textContent=Math.round(state.zoom*100)+'%'; renderMarkers(filteredPlaces()); }
      document.querySelectorAll('.budget-pill').forEach(b=>b.addEventListener('click',()=>{state.budget=b.dataset.budget;renderList();}));
      document.querySelectorAll('.category-pill').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;renderList();}));
      $('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;renderList();});
      $('searchInput').addEventListener('input',e=>{state.query=e.target.value;renderList();}); $('clearSearch').addEventListener('click',()=>{state.query='';$('searchInput').value='';renderList();$('searchInput').focus();});
      $('locationTrigger').addEventListener('click',openRegion); $('closeRegion').addEventListener('click',closeRegion); $('regionBackdrop').addEventListener('click',e=>{if(e.target===$('regionBackdrop'))closeRegion();});
      $('closeDetail').addEventListener('click',closeDetail); $('detailBack').addEventListener('click',closeDetail);
      $('headerReset').addEventListener('click',resetDemo); $('brandReset').addEventListener('click',resetDemo); $('resetMap').addEventListener('click',()=>{state.zoom=1;setMapZoom();}); $('zoomIn').addEventListener('click',()=>{state.zoom=Math.min(1.8,+(state.zoom+.2).toFixed(1));setMapZoom();}); $('zoomOut').addEventListener('click',()=>{state.zoom=Math.max(.7,+(state.zoom-.2).toFixed(1));setMapZoom();}); $('simulateLocation').addEventListener('click',()=>toast('已标出模拟位置；不会请求你的真实定位。'));
      document.querySelectorAll('[data-sheet-action]').forEach(b=>b.addEventListener('click',()=>{ $('listPane').dataset.sheet=b.dataset.sheetAction; }));
      document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('detailPanel').classList.contains('is-open'))closeDetail();else if($('regionBackdrop').classList.contains('is-open'))closeRegion();} });
      window.addEventListener('resize',()=>renderMarkers(filteredPlaces()));
      renderList(); setMapZoom();
    })();
  </script>
</body>
</html>
